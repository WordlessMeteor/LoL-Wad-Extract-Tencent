        access_token_uri: https://live-vts.lol.qq.com:18088/vts/v1/access_token
        auth_token_uri: https://live-vts.lol.qq.com:18088/vts/v1/auth_token
        jwt2gvt_url: https://api.gcloud.qq.com/lol/v1/jwt2gvt
        provider: gvoice
        use_external_auth: true
        voice_domain: gvoice_ch
        voice_url: null
    web_region: staging.na
web_assets_base_path: https://champion.lol.qq.com/
