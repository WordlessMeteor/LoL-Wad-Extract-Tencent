app:
  app_name: LeagueClient
  local_settings_file: Config/LeagueClientSettings.yaml
  log_dir: LeagueClient Logs
  project: leagueclient
  publisher: riot
  respawn:
    command: LeagueClient.exe
    display_name: League of Legends
  splash: lol
  ux_app_bundle_name: League of Legends
  ux_helper_name: LeagueClientUxHelper
  ux_name: LeagueClientUx
build:
  branch: Releases/16.12
  patchline: Tencent
  patchline-visible-name: ''
custom_landing_url: https://lol.qq.com/client/client_lcu.shtml
default_region: TENCENT
patcher:
